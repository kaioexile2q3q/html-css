<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#00ff00">

        </p>
        <p>
            <label for="iniv">Nivel</label>
            <input type="range" name="niv" id="iniv" min="1" max="5">
        </p>
        <p>
            <label for="ifot">Foto de perfil</label>
            <input type="file" name="fot" id="ifot"> <!--Obrigatorio usar o metodo post para este tipo-->
        </p>
       <p><input type="submit" value="enviar">
        <input type="reset" value="deletar"></p>
       </form>
    
</body>
